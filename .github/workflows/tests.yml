name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The stdlib suite across every Node the package claims to support. webtweak.js
  # uses no API newer than ES2017, but `engines: >=18` was previously untested.
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run non-browser tests
        run: python -m pytest -q -m "not browser"

  # Separate job so Playwright is always installed here. The browser modules use
  # a module-level importorskip, so without a dedicated job their tests collapse
  # into one skip line per file and the suite reads green while unrun.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright pytest
          playwright install --with-deps chromium
      # Every browser test, selected by marker rather than by filename - a
      # hardcoded path silently excluded three new browser modules once already.
      - name: Run browser e2e
        run: python -m pytest -q -m browser
      # pytest exits 5 when nothing was collected - a stable contract, unlike
      # grepping its prose for "skipped".
      - name: Fail if no browser test was collected
        run: |
          python -m pytest -q -m browser --collect-only
          test $? -ne 5

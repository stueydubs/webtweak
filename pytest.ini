[pytest]
# -ra shows skip/xfail reasons in the summary, so a skipped browser e2e is
# visible (and its install hint surfaced) rather than silently green.
addopts = -ra

# Browser tests are selected by MARKER, never by filename. CI once ran
# `pytest tests/test_e2e_browser.py` and three later browser modules were
# silently excluded from every job - green, and never executed.
markers =
    browser: requires Playwright and a real browser
